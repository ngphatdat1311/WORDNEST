name: Build Desktop App

# Tự build app cho Windows (.exe), macOS (.dmg) và Linux (.AppImage/.deb) trên
# máy ảo của GitHub — electron-builder chỉ build được bản cho ĐÚNG hệ điều hành
# đang chạy nó (không cross-build được cả 3 từ 1 máy), nên phải nhờ CI chạy
# song song trên 3 loại runner khác nhau. Đẩy tag dạng v1.0.0 sẽ tự đính file
# cài vào GitHub Release; có thể bấm chạy tay (workflow_dispatch) để build thử
# mà chưa cần tạo release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # electron@43 yêu cầu Node >= 22.12.0 để cài đặt/build (không phải version
      # Node CHẠY BÊN TRONG app — Electron tự mang theo Node runtime riêng).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Chặn sớm nếu lint/test fail — đỡ tốn phút CI cho việc build multi-OS
      # (Windows + macOS + Linux) một bản chắc chắn có lỗi.
      - run: npm run lint
      - run: npm test
      - run: npm run build:electron

      # --publish never: chỉ build ra file, không để electron-builder tự upload
      # (việc đính vào Release đã có bước riêng "softprops/action-gh-release" ở dưới).
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # continue-on-error: đây chỉ là tiện ích PHỤ (tải file build thô ngay trên
      # trang Actions), KHÔNG phải cơ chế chính đưa file cài vào GitHub Release
      # (đó là bước "action-gh-release" riêng ở dưới, đọc thẳng dist/ trên máy ảo,
      # không phụ thuộc bước này). Tài khoản free của GitHub chỉ có 500MB dung
      # lượng lưu artifact — rất dễ đầy sau nhiều lần release — nếu bước này lỗi vì
      # hết quota thì KHÔNG được để nó chặn luôn cả việc đính file vào Release thật.
      # retention-days ngắn để artifact mới tự dọn sớm, đỡ tích tụ đầy quota lần sau.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: wordnest-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 7

      # latest.yml / latest-mac.yml / latest-linux.yml: electron-updater đọc file
      # này để biết phiên bản mới nhất + link tải — thiếu nó thì app sẽ không bao
      # giờ thấy có bản mới.
      - name: Đính file cài vào GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
